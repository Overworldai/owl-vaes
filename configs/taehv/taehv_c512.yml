model:
  model_id: taehv

  # TAEHV architecture
  # patch_size=2 gives 16x total spatial (pixel_unshuffle 2x + 3 encoder stages of 2x each),
  # matching HY 1.5 VAE's 16x spatial downscale.
  patch_size: 2
  encoder_channels: 64
  decoder_channels: [512, 256, 128, 128]
  blocks_per_stage: 3

  # Temporal scaling (WAN 2.1 defaults)
  encoder_time_downscale: [true, true, false]
  decoder_time_upscale: [false, true, true]
  decoder_space_upscale: [true, true, true]


train:
  trainer_id: taehv
  data_id: video_dir_loader
  data_kwargs:
    source:
     - /mnt/data/waypoint_1/owl_control/processed/*/recording.mp4
    target_size: [720, 1280]

  # Reference VAE to distill from
  ref_vae_id: hy1.5

  # What to train
  train_encoder: false
  train_decoder: true

  # Frame config (HY 1.5 VAE requires n_frames = 4k+1)
  n_frames: 13
  n_seraena_frames: 3
  # Sampling uses batch=1, so we can afford longer windows. Also 4k+1.
  sample_n_frames: 49

  seraena_warmup_steps: 200

  target_batch_size: 16
  batch_size: 2

  epochs: 200

  opt: AdamW
  opt_kwargs:
    lr: 3.0e-4
    weight_decay: 0.0
    betas: [0.9, 0.95]

  loss_weights:
    l2: 1.0
    gan: 1.0

  scheduler: null

  checkpoint_dir: /mnt/data/laplace/checkpoints/taehv_c512
  resume_ckpt: /mnt/data/laplace/checkpoints/taehv_c512/step_15000.pt

  sample_interval: 500
  save_interval: 5000

wandb:
  name: d-fusion
  project: taehv
  run_name: taehv_hy_c512
